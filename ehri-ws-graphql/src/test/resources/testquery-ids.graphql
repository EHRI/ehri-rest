query ids {
    docs: documentaryUnits(ids: ["c2", "c1", "missing", "r1", "c1"]) {
        items {
            id
        }
        edges {
            node {
                id
            }
        }
    }
    firstDoc: documentaryUnits(ids: ["c2", "c1"], first: 1) {
        items {
            id
        }
        pageInfo {
            hasNextPage
        }
    }
    repositories(ids: ["r1", "c1"]) {
        items {
            id
        }
    }
    negativeFrom: documentaryUnits(ids: ["c2", "c1"], first: 1, from: "LTE=") {
        items {
            id
        }
        edges {
            cursor
        }
        pageInfo {
            hasPreviousPage
            nextPage
        }
    }
}
