query accessPoints {
    c1: DocumentaryUnit(id: "c1") {
        connectedSubjects: connected(accessPointType: subject) {
            item {
                ... on HistoricalAgent {
                    id
                }
            }
        }
        connectedPeople: connected(accessPointType: person) {
            item {
                ... on HistoricalAgent {
                    id
                }
            }
        }
        connectedSubjectsOrPeople: connected(accessPointType: [subject, person]) {
            item {
                ... on HistoricalAgent {
                    id
                }
            }
        }
        connectedAssociativeSubjects: connected(linkType: associative, accessPointType: subject) {
            item {
                ... on HistoricalAgent {
                    id
                }
            }
        }
        incomingSubjects: connected(accessPointType: subject, direction: incoming) {
            item {
                ... on HistoricalAgent {
                    id
                }
            }
        }
        outgoingAny: connected(direction: outgoing) {
            item {
                ... on HistoricalAgent {
                    id
                }
            }
        }
        all: connected {
            item {
                __typename
            }
        }
        description(languageCode: "eng", identifier: "c1-desc") {
            accessPoints {
                name
            }
            subjectAccessPoints: accessPoints(type: subject) {
                name
            }
            placeAccessPoints: accessPoints(type: place) {
                name
            }
            subjectOrPersonAccessPoints: accessPoints(type: [subject, person]) {
                name
            }
            subjectOrPlaceAccessPoints: accessPoints(type: [subject, place]) {
                name
            }
        }
    }

    a1: HistoricalAgent(id: "a1") {
        subjects: connected(accessPointType: subject) {
            item {
                ... on DocumentaryUnit {
                    id
                }
            }
        }
        outgoingSubjects: connected(accessPointType: subject, direction: outgoing) {
            item {
                ... on DocumentaryUnit {
                    id
                }
            }
        }
        incomingSubjects: connected(accessPointType: subject, direction: incoming) {
            item {
                ... on DocumentaryUnit {
                    id
                }
            }
        }
        allSubjects: connected(accessPointType: subject, direction: both) {
            item {
                ... on DocumentaryUnit {
                    id
                }
            }
        }
    }
}
