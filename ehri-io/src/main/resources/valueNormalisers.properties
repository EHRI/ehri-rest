# Declares, per raw property name, which normaliser (see ImportHelpers.NORMALISER_FUNCTIONS)
# is applied to its value, and optionally a fallback property to store the raw value under
# when normalisation fails.
#
# Format: property = normaliser[:fallbackProperty]
languageCode=languageCode
languageOfMaterial=languageCode:languageOfMaterialNotes
scriptOfMaterial=scriptCode
languageUsed=languageCode
